<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Napkin — the daily guesstimate</title>
  <link rel="stylesheet" href="assets/styles.css?v=5">
</head>
<body>
  <header class="topbar">
    <div class="brand">Napkin<span class="brand-dot">.</span></div>
    <nav class="tabs">
      <button class="tab" data-view="daily">Today</button>
      <button class="tab" data-view="practice">Practice</button>
      <button class="tab" data-view="stats">Stats</button>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="foot">One question a day. Work it out on a napkin. See how close you got.</footer>

  <!-- Zero-build: plain classic scripts, loaded in order, sharing window.NAPKIN.
       Bump ?v= on every deploy so phones don't serve stale cached files
       (GitHub Pages sets max-age=600 on these). -->
  <script src="js/questions.js?v=5"></script>
  <script src="js/scoring.js?v=5"></script>
  <script src="js/storage.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
